<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동네 가이드 · 다올스테이 DAOL STAY</title>
<meta name="description" content="다올스테이 동네 가이드: 서초역·교대역에서 사진으로 보는 길 안내, 걸어서 가는 밥집과 편의시설, 집 안 안내와 긴급 연락처.">
<link rel="icon" href="../photos/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
/* intro */
.intro{padding:28px 0 0}
.intro h1{font-size:clamp(27px,7vw,36px);line-height:1.3;margin:0 0 6px}
.intro .sub{color:var(--ink-soft);margin:0}

/* route */
.tabs{display:flex;gap:6px;margin:4px 0 6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 8px;cursor:pointer;font-size:14px;line-height:1.4;color:var(--ink-soft)}
.tabs button b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink)}
.tabs button[aria-pressed="true"]{border-color:var(--latte);border-width:2px;padding:9px 7px;background:var(--latte-soft)}
.stage{padding:22px 0 8px;border-bottom:1px solid var(--line)}
.stage:last-of-type{border-bottom:0}
.stage-head{display:flex;align-items:center;gap:10px}
.stage-head i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--latte);color:var(--bg);font-style:normal;font-family:var(--latin);font-size:17px;font-weight:600;display:grid;place-items:center}
.stage .strip figure{flex-basis:62%}
.stage .strip img{aspect-ratio:1/1}
.stage .strip figcaption{display:flex;gap:6px}
.stage .strip figcaption b{color:var(--latte);font-weight:400}
.stage ol{margin:6px 0 10px;padding-left:20px}
.stage li{margin-bottom:4px}
.stage li::marker{color:var(--latte)}

/* walking ruler */
.ruler{position:relative;margin:24px 0 8px;padding-left:64px}
.ruler::before{content:"";position:absolute;left:44px;top:6px;bottom:6px;width:6px;border-radius:3px;
  background:repeating-linear-gradient(to bottom,var(--latte) 0 1px,transparent 1px 12px),var(--latte-soft)}
.r-home{position:relative;font-family:var(--serif);font-weight:700;padding:0 0 4px}
.r-home::before{content:"";position:absolute;left:-26px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--latte)}
.r-row{position:relative;display:block;text-decoration:none;padding:4px 0}
.r-row .m{position:absolute;left:-64px;width:36px;text-align:right;font-size:13px;color:var(--latte);top:6px;font-variant-numeric:tabular-nums}
.r-row::before{content:"";position:absolute;left:-24px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--latte)}
.r-row.daily::before{border-color:var(--sage)}
.r-row.stn::before{background:var(--ink);border-color:var(--ink)}
.r-row .nm{font-size:16px}
.r-row .kind{font-size:12px;color:var(--ink-soft);margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-soft);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--latte);margin-right:6px;vertical-align:-1px}
.legend i.d{border-color:var(--sage)}
.legend i.s{background:var(--ink);border-color:var(--ink)}

/* places */
.place{padding:20px 0;border-bottom:1px solid var(--line);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.place:last-child{border-bottom:0}
.place-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.walk{flex:none;font-size:13px;color:var(--latte);white-space:nowrap}
.daily .walk{color:var(--sage)}
.place .orig{font-size:13px;color:var(--ink-soft);margin:-2px 0 6px}
.place p{margin:0 0 8px}
.place .info{font-size:14px;color:var(--ink-soft);margin-bottom:10px}
.place figure{margin:4px 0 12px}
.place figure img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px}

/* house */
.amen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 0}
@media (max-width:420px){.amen{grid-template-columns:1fr}}
.amen div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.amen h3{font-size:16px;margin-bottom:6px}
.amen ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-soft)}
.rules{list-style:none;margin:20px 0 0;padding:0;counter-reset:r}
.rules li{counter-increment:r;position:relative;padding:0 0 14px 36px}
.rules li::before{content:counter(r);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--latte-soft);color:var(--latte);font-size:13px;display:grid;place-items:center}

/* help */
.calls{list-style:none;margin:6px 0 0;padding:0}
.calls li{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.calls a{font-family:var(--latin);font-size:28px;font-weight:600;text-decoration:none;color:var(--latte);line-height:1}
.calls span{font-size:15px}
.calls small{display:block;font-size:13px;color:var(--ink-soft)}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="top-row">

  <section id="intro" class="intro">

    <h1 data-t="gTitle"></h1>
    <p class="sub" data-t="gSub"></p>
  </section>

  <section id="route">
    <h2 data-t="routeTitle"></h2>
    <p class="lead" data-t="routeLead"></p>
    <div class="tabs" role="group" id="routeTabs"></div>
    <div id="stages"></div>
    <p class="note" data-t="doorNote"></p>
  </section>

  <section id="walk">

    <div class="ruler" id="ruler"></div>

    <p class="note" data-t="walkNote"></p>
  </section>

  <section id="eat">

    <div id="eatList"></div>
  </section>

  <section id="daily">

    <div class="daily" id="dailyList"></div>
  </section>

  <section id="home">

    <p class="lead" data-t="homeLead"></p>
    <div class="amen" id="amen"></div>
    <h3 style="margin-top:30px" data-t="rulesTitle"></h3>
    <ol class="rules" id="rules"></ol>
  </section>

  <section id="help">
    <h2 data-t="helpTitle"></h2>
    <p class="lead" data-t="helpLead"></p>
    <ul class="calls" id="calls"></ul>
    <dl class="info-list" style="margin-top:18px">
      <div><dt data-t="addrLabel"></dt><dd><span data-t="addr"></span><br><button class="copy" id="copyBtn" data-t="copy"></button>
        <div class="pills" style="margin-top:10px" id="homeMaps"></div></dd></div>
    </dl>
  </section>
</main>
<footer class="wrap">
  <img src="../photos/logo.png" alt="">
  <div data-t="foot"></div>
  <a href="../" data-t="backHome"></a>
</footer>

};

const CALLS = [
 {n:"112",t:{ko:"경찰",en:"Police",zh:"报警",ja:"警察"}},
 {n:"119",t:{ko:"화재 · 구급",en:"Fire & ambulance",zh:"火警・急救",ja:"火災・救急"}},
 {n:"1330",t:{ko:"관광통역안내",en:"Korea Travel Helpline",zh:"旅游咨询热线",ja:"観光通訳案内"},
  s:{ko:"영어·중국어·일본어 등 24시간",en:"English, Chinese, Japanese & more, 24 hours",zh:"中文・英语・日语等，24小时",ja:"日本語・英語・中国語など24時間"}}
];

const SECTIONS = ["route","walk","eat","daily","home","help"];
let lang = "ko", route = "seocho";
try{ const s = localStorage.getItem("daol-lang"); if(s && UI[s]) lang = s; }catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function mapLinks(p, t){
  const out = [];
  if(p.q) out.push(`<a href="https://map.naver.com/p/search/${encodeURIComponent(p.q)}" target="_blank" rel="noopener">${t.naver}</a>`);
  if(p.map) out.push(`<a href="${esc(p.map)}" target="_blank" rel="noopener">${t.google}</a>`);
  return out.join("");
}

function placeHTML(p, t){
  const orig = lang==="ko" ? "" : `<div class="orig">${esc(p.name.ko)}</div>`;
  const walk = p.min ? t.min(p.min) : (p.area ? p.area[lang] : "");
  const body = p.desc ? `<p>${esc(p.desc[lang])}</p>` : "";
  const info = p.info ? `<div class="info">${esc(p.info[lang])}</div>` : "";
  return `<article class="place" id="p-${p.id}">
    <div class="place-head"><h3>${esc(p.name[lang])}</h3><span class="walk">${esc(walk)}</span></div>
    ${orig}
    ${p.img?`<figure><img src="../photos/${p.img}.jpg" alt="${esc(p.name[lang])}" loading="lazy"></figure>`:""}
    ${body}${info}
    <div class="pills">${mapLinks(p,t)}</div>
  </article>`;
}

function renderRoute(t){
  $("#routeTabs").innerHTML = ["seocho","kyodae"].map(k=>{
    const tab = t[k==="seocho"?"tabSeocho":"tabKyodae"];
    return `<button data-route="${k}" aria-pressed="${route===k}"><b>${esc(tab[0])}</b>${esc(tab[1])}</button>`;
  }).join("");
  document.querySelectorAll("#routeTabs button").forEach(b=>b.addEventListener("click",()=>{ route=b.dataset.route; renderRoute(UI[lang]); }));
  $("#stages").innerHTML = ROUTES[route].map((s,i)=>`<div class="stage">
    <div class="stage-head"><i>${i+1}</i><h3>${esc(t.stageTitles[i])}</h3></div>
    <div class="strip">${s.photos.map((ph,j)=>`<figure><img src="../photos/route_${ph}.jpg" alt="${esc(s.steps[lang][j]||"")}" loading="lazy"><figcaption><b>${j+1}</b>${esc(s.steps[lang][j]||"")}</figcaption></figure>`).join("")}</div>
  </div>`).join("");
}

function render(){
  const t = UI[lang];
  document.documentElement.lang = lang==="zh" ? "zh-Hans" : lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#nav").innerHTML = SECTIONS.map((id,i)=>`<a href="#${id}" data-sec="${id}">${esc(t.nav[i])}</a>`).join("");

  renderRoute(t);

  // ruler: proportional spacing by minutes
  const all = [...EAT.map(p=>({...p,type:"food"})), ...DAILY.map(p=>({...p,type:"daily"})), ...STATIONS]
    .filter(p=>p.min).sort((a,b)=>a.min-b.min || (a.type>b.type?1:-1));
  let html = `<div class="r-home">${esc(t.home)}</div>`, prev = 0;
  all.forEach(p=>{
    const gap = Math.max(0,(p.min - prev))*9;
    prev = p.min;
    const cls = p.type==="food" ? "" : p.type;
    const href = p.type==="stn" ? "#route" : `#p-${p.id}`;
    html += `<a class="r-row ${cls}" href="${href}" style="margin-top:${gap}px"><span class="m">${t.minShort(p.min)}</span><span class="nm">${esc(p.name[lang])}</span><span class="kind">${esc(p.kind[lang])}</span></a>`;
  });
  $("#ruler").innerHTML = html;

  $("#eatList").innerHTML = EAT.map(p=>placeHTML(p,t)).join("");
  $("#dailyList").innerHTML = DAILY.map(p=>placeHTML(p,t)).join("");

  $("#amen").innerHTML = AMEN.map(g=>`<div><h3>${esc(g.t[lang])}</h3><ul>${g.i[lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
  $("#rules").innerHTML = RULES[lang].map(r=>`<li>${esc(r)}</li>`).join("");

  $("#calls").innerHTML = CALLS.map(c=>`<li><a href="tel:${c.n}">${c.n}</a><span>${esc(c.t[lang])}${c.s?`<small>${esc(c.s[lang])}</small>`:""}</span></li>`).join("")
    + `<li><a href="tel:${HOST_TEL}" style="font-size:17px">${HOST_TEL_LABEL}</a><span>${esc(t.hostCall)}<small>${esc(t.hostNote)}</small></span></li>`;

  $("#homeMaps").innerHTML = `<a href="${NAVER_PLACE}" target="_blank" rel="noopener">${t.naver}</a><a href="https://www.google.com/maps/search/?api=1&query=${HOME.lat},${HOME.lng}" target="_blank" rel="noopener">${t.google}</a>`;
  observe();
}

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.lang;
  try{ localStorage.setItem("daol-lang", lang); }catch(e){}
  render();
}));

$("#copyBtn").addEventListener("click", async ()=>{
  const text = HOME.q;
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); ok=document.execCommand("copy"); ta.remove(); }catch(_){}
  }
  const toast = $("#toast"); toast.textContent = ok ? UI[lang].copied : text;
  toast.classList.add("show"); setTimeout(()=>toast.classList.remove("show"), 1800);
});

let io;
function observe(){
  if(io) io.disconnect();
  if(!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll("#nav a").forEach(a=>{
          const on = a.dataset.sec===e.target.id; a.classList.toggle("on",on);
          if(on){ const n=$("#nav"); n.scrollLeft = a.offsetLeft - 20; }
        });
      }
    });
  },{rootMargin:"-40% 0px -55% 0px"});
  SECTIONS.forEach(id=>{ const el=document.getElementById(id); if(el) io.observe(el); });
}

// language from link: #en, #zh, #ja, #ko
const h = (location.hash||"").slice(1);
if(UI[h]){ lang = h; try{ localStorage.setItem("daol-lang", lang); }catch(e){} }
render();
</script>
</body>
</html>
