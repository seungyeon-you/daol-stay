<style>
/* hero */
.hero{margin-top:16px}
.hero>img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.hero-text{padding:26px 0 8px;text-align:center}
.hero .logo{width:132px;margin:0 auto 16px}
.hero h1{font-size:clamp(25px,6.6vw,34px);line-height:1.4;margin:0 0 8px}
.hero .sub{color:var(--ink-soft);margin:0}
.poem{font-family:var(--serif);color:var(--ink-soft);text-align:center;margin:22px 0 0;line-height:2}
.name-gloss{display:flex;gap:28px;margin:30px 0 6px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.name-gloss span{font-size:14px;color:var(--ink-soft)}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 10px 8px;margin:4px 0 6px}
.plan svg{display:block;width:100%;height:auto}
.plan .wall{fill:none;stroke:var(--ink);stroke-width:2.5}
.plan .cell{fill:var(--surface);stroke:var(--ink);stroke-width:1.2;transition:fill .15s}
.plan .bed{fill:var(--latte-soft)}
.plan a:hover .cell,.plan a:focus .cell{fill:var(--latte-soft)}
.plan a:hover .bed,.plan a:focus .bed{fill:var(--latte);fill-opacity:.35}
.plan .stairs{stroke:var(--ink-soft);stroke-width:.8}
.plan text{font-family:var(--sans);fill:var(--ink);font-size:11px;text-anchor:middle}
.plan text.s{fill:var(--ink-soft);font-size:9.5px}
.plan text.fl{font-family:var(--latin);font-style:italic;font-size:17px;text-anchor:start;fill:var(--latte)}
.plan-hint{font-size:13px;color:var(--ink-soft);text-align:center;margin:6px 0 0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{text-align:center;padding:12px 4px}
.facts div+div{border-left:1px solid var(--line)}
.facts b{display:block;font-family:var(--latin);font-size:30px;font-weight:600;line-height:1.1}
.facts span{font-size:13px;color:var(--ink-soft)}

.space{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.space .shots{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.space .shots::-webkit-scrollbar{display:none}
.space .shots img{flex:0 0 100%;width:100%;aspect-ratio:3/2;object-fit:cover;scroll-snap-align:start}
.space .count{font-size:12px;color:var(--ink-soft);text-align:right;padding:6px 14px 0}
.space-body{padding:12px 18px 20px}
.space-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.space-head h3{font-size:22px}
.space-head span{font-size:14px;color:var(--latte)}
.space .tagline{font-family:var(--serif);margin:0 0 10px}
.space .detail{font-size:15px;color:var(--ink-soft);margin:0}

.rating{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:0 0 18px}
.rating .score{font-family:var(--latin);font-size:40px;font-weight:600;line-height:1}
.rating .score small{font-size:20px;color:var(--latte)}
.rating div:last-child{font-size:14px;color:var(--ink-soft);line-height:1.5}
.perks{list-style:none;margin:0 0 6px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perks li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:14px;line-height:1.5}
.perks li b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:2px}
@media (max-width:420px){.perks{grid-template-columns:1fr}}

.book a{flex:1 1 auto;text-align:center;text-decoration:none;padding:13px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.book a.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-family:var(--serif);font-weight:700}
.book a:hover{border-color:var(--latte)}

#letterStrip figure{flex-basis:70%}
#letterStrip img{aspect-ratio:1/1}

.near{list-style:none;margin:4px 0 0;padding:0}
.near li{display:grid;grid-template-columns:58px 1fr auto;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.near .m{font-family:var(--latin);font-size:22px;font-weight:600;color:var(--latte);line-height:1}
.near .m small{font-family:var(--sans);font-size:12px;margin-left:2px}
.near .k{font-size:13px;color:var(--ink-soft)}
</style>

const SECTIONS = ["about","house","stay","letters","around","location"];
let lang = "ko";
try{ const s = localStorage.getItem("daol-lang"); if(s && UI[s]) lang = s; }catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function planSVG(t){
  const cell = (id,x,y,w,h,label,sub,bed) => `<a href="#sp-${id}" aria-label="${esc(label)}">
    <rect class="cell${bed?" bed":""}" x="${x}" y="${y}" width="${w}" height="${h}"/>
    <text x="${x+w/2}" y="${y+h/2-(sub?2:-4)}">${esc(label)}</text>${sub?`<text class="s" x="${x+w/2}" y="${y+h/2+12}">${esc(sub)}</text>`:""}</a>`;
  const stairs = (x,y,w,h) => { let s=""; for(let i=1;i<6;i++) s+=`<line class="stairs" x1="${x+w*i/6}" y1="${y+4}" x2="${x+w*i/6}" y2="${y+h-4}"/>`; return s; };
  return `<svg viewBox="0 0 340 236" role="img" aria-label="${esc(t.houseTitle)}">
    <text class="fl" x="6" y="58">4F</text>
    <rect class="cell" x="120" y="22" width="46" height="78"/>${stairs(120,22,46,78)}
    <text class="s" x="143" y="112">${esc(t.pStairs)}</text>
    ${cell("room2",166,22,96,78,t.pRoom(2),t.pSingle,true)}
    ${cell("room3",262,22,72,78,t.pRoom(3),t.pQueen,true)}
    <rect class="wall" x="120" y="22" width="214" height="78"/>
    <text class="fl" x="6" y="124">3F</text>
    ${cell("bath",6,132,34,90,t.pBath,"",false)}
    ${cell("room1",40,132,80,90,t.pRoom(1),t.pQueen,true)}
    <rect class="cell" x="120" y="132" width="46" height="90"/>${stairs(120,132,46,90)}
    ${cell("living",166,132,46,90,t.pKitchen,"",false)}
    ${cell("bath",212,132,34,52,t.pBath,"",false)}
    ${cell("living",246,132,88,90,t.pLiving,"",false)}
    <rect class="wall" x="6" y="132" width="328" height="90"/>
  </svg>`;
}

function spaceHTML(s, t){
  const name = t[s.key+"Name"];
  return `<article class="space" id="sp-${s.key}">
    <div class="shots">${s.imgs.map((k,i)=>`<img src="photos/${k}.jpg" alt="${esc(name)} ${i+1}" loading="lazy">`).join("")}</div>
    <div class="count">${s.imgs.length>1?`← ${s.imgs.length} →`:""}</div>
    <div class="space-body">
      <div class="space-head"><h3>${esc(name)}</h3><span>${esc(t["fl"+s.floor])}</span></div>
      <p class="tagline">${esc(t[s.key+"Tag"])}</p>
      <p class="detail">${esc(t[s.key+"Detail"])}</p>
    </div>
  </article>`;
}

function render(){
  const t = UI[lang];
  document.documentElement.lang = lang==="zh" ? "zh-Hans" : lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(typeof v !== "string") return;
    if(el.dataset.t==="stations" || el.dataset.t==="poem") el.innerHTML = esc(v).replace(/\n/g,"<br>").replace(/&lt;br&gt;/g,"<br>");
    else el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#nav").innerHTML = SECTIONS.map((id,i)=>`<a href="#${id}" data-sec="${id}">${esc(t.nav[i])}</a>`).join("");

  $("#gallery").innerHTML = GALLERY.map(g=>`<figure><img src="photos/${g.k}.jpg" alt="${esc(g.c[lang])}" loading="lazy"><figcaption>${esc(g.c[lang])}</figcaption></figure>`).join("");

  $("#plan").innerHTML = planSVG(t);
  $("#facts").innerHTML = t.facts.map(f=>`<div><b>${f[0]}</b><span>${esc(f[1])}</span></div>`).join("");
  $("#spaceList").innerHTML = SPACES.map(s=>spaceHTML(s,t)).join("");

  $("#rating").innerHTML = `<div class="score"><small>★</small> ${CONFIG.rating}</div><div>${t.ratingText(CONFIG.reviews)}</div>`;
  $("#perks").innerHTML = t.perks.map(p=>`<li><b>${esc(p[0])}</b>${esc(p[1])}</li>`).join("");
  const links = [];
  if(BOOK.airbnb) links.push(`<a class="main" href="${BOOK.airbnb}" target="_blank" rel="noopener">${esc(t.bookAirbnb)}</a>`);
  if(BOOK.booking) links.push(`<a href="${BOOK.booking}" target="_blank" rel="noopener">Booking.com</a>`);
  if(BOOK.naver) links.push(`<a href="${BOOK.naver}" target="_blank" rel="noopener">${esc(t.bookNaver)}</a>`);
  $("#book").innerHTML = links.join("");

  $("#letterStrip").innerHTML = LETTERS.map(k=>`<figure><img src="photos/${k}.jpg" alt="" loading="lazy"></figure>`).join("");

  const hash = lang==="ko" ? "" : "#"+lang;
  $("#near").innerHTML = NEAR.map(p=>`<li><span class="m">${p.min}<small>${esc(t.minU)}</small></span><span>${esc(p.name[lang])}</span><span class="k">${esc(p.kind[lang])}</span></li>`).join("");
  $("#guideLink").href = "guide/" + hash;

  $("#cin").textContent = CONFIG.checkin;
  $("#cout").textContent = CONFIG.checkout;
  const naver = BOOK.naver || "https://map.naver.com/p/search/" + encodeURIComponent(HOME.q);
  const google = "https://www.google.com/maps/search/?api=1&query=" + HOME.lat + "," + HOME.lng;
  $("#homeMaps").innerHTML = `<a href="${naver}" target="_blank" rel="noopener">${esc(t.naverMap)}</a><a href="${google}" target="_blank" rel="noopener">${esc(t.googleMap)}</a>`;
  observe();
}

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.lang;
  try{ localStorage.setItem("daol-lang", lang); }catch(e){}
  render();
}));

$("#copyBtn").addEventListener("click", async ()=>{
  const text = HOME.q;
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); ok=document.execCommand("copy"); ta.remove(); }catch(_){}
  }
  const toast = $("#toast"); toast.textContent = ok ? UI[lang].copied : text;
  toast.classList.add("show"); setTimeout(()=>toast.classList.remove("show"), 1800);
});

let io;
function observe(){
  if(io) io.disconnect();
  if(!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll("#nav a").forEach(a=>{
          const on = a.dataset.sec===e.target.id; a.classList.toggle("on",on);
          if(on){ const n=$("#nav"); n.scrollLeft = a.offsetLeft - 20; }
        });
      }
    });
  },{rootMargin:"-40% 0px -55% 0px"});
  SECTIONS.forEach(id=>{ const el=document.getElementById(id); if(el) io.observe(el); });
}

// language from link: #en, #zh, #ja, #ko
const h = (location.hash||"").slice(1);
if(UI[h]){ lang = h; try{ localStorage.setItem("daol-lang", lang); }catch(e){} }
render();
